name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confere versão da tag com plugin.json
        run: |
          versao=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          test "v$versao" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != plugin.json v$versao"; exit 1; }
      - run: python3 scripts/validar.py
      - run: python3 scripts/exportar_skills.py
      - name: Publica release com as skills portáteis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
